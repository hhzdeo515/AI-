<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智能助手</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='exam.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='studio.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='hardware.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='live-translation.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='lens-map.css') }}">
</head>
<body>

<!-- Ambient background：极低透明度光斑 + 网格，只做氛围，不参与信息表达 -->
<div class="ambient" aria-hidden="true">
  <span class="blob blob-a"></span>
  <span class="blob blob-b"></span>
  <span class="blob blob-c"></span>
  <span class="grid"></span>
</div>

<div class="app glasses-app">

  <!-- ── 工作区 ─────────────────────────────────────────────────── -->
  <main class="workspace">
    <header class="topbar">
      <button type="button" class="top-brand" data-go="hardware" aria-label="返回眼镜视野" title="返回眼镜视野">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span>
        <strong>智能助手</strong>
      </button>
      <div class="crumb" id="crumb" hidden>眼镜视野</div>
      <div class="spacer"></div>
      <div class="model-picker">
        <span class="model-label">模型</span>
        <div class="model-switch" role="group" aria-label="选择解题模型" title="只切换解题模型，资料和记录共用">
          <button type="button" data-model="original" aria-pressed="true">原版</button>
          <button type="button" data-model="jev" aria-pressed="false" title="JEV 决策，VL 识图；资料和记录共用">JEV</button>
        </div>
        <span id="model-status" class="model-status" role="status" aria-live="polite" hidden></span>
      </div>
      <button type="button" class="top-library" data-go="memory" aria-current="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2 3.2 7.6 12 12l8.8-4.4L12 3.2Z"/><path d="m3.2 12.4 8.8 4.4 8.8-4.4"/><path d="m3.2 16.8 8.8 4.4 8.8-4.4"/></svg>
        <span>资料库</span>
      </button>
      <div class="chips" id="chips" hidden>
        <span class="chip" data-chip="vision"><i class="dot"></i>拍照解题</span>
        <span class="chip" data-chip="audio"><i class="dot"></i>录音</span>
        <span class="chip" data-chip="assistant"><i class="dot"></i>助手</span>
      </div>
      <button class="icon-btn" id="ctx-toggle" hidden aria-label="上下文面板" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M9 5h10M9 12h10M9 19h10"/>
          <circle cx="4.6" cy="5" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="4.6" cy="12" r="1.1" fill="currentColor" stroke="none"/>
          <circle cx="4.6" cy="19" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </header>

    <div class="stage" id="stage">

      <section class="view" data-view="hardware"><div id="hardware-demo"></div></section>

      <!-- ── MEETING ────────────────────────────────────────────── -->
      <section class="view" data-view="meeting">

        <div class="actions">
          <button class="btn btn-primary" id="meeting-record-toggle" aria-pressed="false">开启录音</button>
          <button class="btn" id="meeting-start">开始文字记录</button>
          <button class="btn" id="meeting-audio">上传已有录音</button>
          <button class="btn" id="meeting-pause" hidden>暂停记录</button>
          <button class="btn btn-ghost" id="meeting-stop" hidden>结束会议记录</button>
        </div>

        <p id="meeting-record-status" role="status" aria-live="polite">录音已关闭，麦克风未开启。</p>
        <div id="meeting-record-preview" hidden>
          <audio id="meeting-record-player" controls></audio>
          <div class="actions">
            <button class="btn" id="meeting-record-use">提交录音转写</button>
            <a class="btn btn-ghost" id="meeting-record-download">下载录音</a>
            <button type="button" class="btn btn-ghost" id="meeting-record-delete">删除录音</button>
          </div>
        </div>

        <div class="panel" id="meeting-session" hidden>
          <div class="panel-head">
            <span class="panel-title">会议记录</span>
            <span class="badge" id="meeting-badge">就绪</span>
          </div>

          <div class="audio-monitor" id="meeting-monitor" hidden>
            <span class="mono-time" id="mono-time">00:00</span>
            <svg class="wave wave-live" viewBox="0 0 240 34" preserveAspectRatio="none">
              <path class="wave-path" d="M0 17h10l4-9 5 18 5-14 4 10 4-6h12l4-8 5 16 5-12 4 8 4-4h12l4-7 5 14 5-10 4 7 4-3h12l4-6 5 12 5-9 4 6 4-3h12l4-5 5 10 5-8 4 5 4-2h14l4-6 5 11 5-8 4 6 4-3h13"/>
            </svg>
            <span class="mono-state" id="mono-state">文字记录</span>
          </div>

          <textarea id="meeting-transcript" rows="5" placeholder="输入会议记录"></textarea>
          <div class="panel-foot">
            <span class="count" id="meeting-count">0 字</span>
            <div class="spacer"></div>
            <button class="btn btn-ghost" id="meeting-append">追加记录</button>
            <button class="btn btn-primary" id="meeting-summarize">生成纪要</button>
          </div>
        </div>

        <div class="pipeline" id="meeting-pipeline" hidden></div>
        <div class="result" id="meeting-result" hidden></div>
      </section>

      <!-- ── VISION ─────────────────────────────────────────────── -->
      <!-- 图片统一走底部输入框（拖入 / 粘贴 / 选文件），结果按对话流落在这里 -->
      <section class="view" data-view="vision">
        <div class="scene-tools">
          <button class="btn btn-ghost btn-sm" id="vision-clear" hidden>清空对话</button>
        </div>

        <div id="exam-controls">
          <div class="exam-camera-actions">
            <button type="button" class="btn btn-primary" id="exam-camera-open">拍照</button>
            <button type="button" class="btn btn-ghost" id="exam-album">从相册选择</button>
            <label><input type="checkbox" id="exam-camera-silent" checked> 拍照静音</label>
          </div>
          <p id="exam-camera-note" hidden>已关闭应用内拍照提示音。系统相机快门声由设备控制。</p>
          <div class="exam-fields">
            <label>考试场景<select id="exam-profile"><option value="auto">自动判断</option><option value="recruitment">国央企 / 事业单位招聘</option><option value="internal">单位内部考试</option><option value="campus">高校课程测试</option></select></label>
            <label>考试时间或资料口径<input id="exam-date" maxlength="40" placeholder="选择资料适用时间"></label>
          </div>
          <div class="exam-checks">
              <label><input type="checkbox" id="exam-public" checked> 考试知识与方法</label>
            <label><input type="checkbox" id="exam-web" checked> 联网核实</label>
            <label><input type="checkbox" id="exam-grounded"> 依据资料作答</label>
          </div>
            <details id="exam-public-catalog">
              <summary>查看内置考试知识</summary>
              <p id="exam-public-status">正在读取知识目录…</p>
              <div id="exam-public-modules"></div>
              <p>按题检索相关知识。法律、政策和时政按适用年份核实；图形与类比方法仍需逐项核对原图和选项。</p>
            </details>
          <p id="exam-policy" hidden>识题后按题型解答，计算与原图分别核对；具体错误最多自动纠正一次。</p>
          <details id="exam-library">
            <summary>参考资料 <span id="exam-library-count">未选择</span></summary>
            <div id="exam-documents"></div>
            <details class="exam-import"><summary>添加资料</summary>
              <form id="exam-import-form">
                <div class="exam-fields">
                  <label>资料标题<input id="exam-doc-title" required maxlength="160" placeholder="例如：员工培训考核办法"></label>
                  <label>版本与适用日期<input id="exam-doc-version" maxlength="80" placeholder="例如：2025版，2025-01-01起适用"></label>
                </div>
                <label class="exam-content-label">资料正文<textarea id="exam-doc-content" rows="5" maxlength="200000" placeholder="粘贴需要检索和引用的原文，或选择文件"></textarea></label>
                <label class="exam-content-label">导入文件<input type="file" id="exam-doc-file" accept=".txt,.md,.docx"></label>
                <button class="btn btn-primary btn-sm" type="submit">保存并选用</button>
              </form>
            </details>
            <p id="exam-library-status" role="status" aria-live="polite"></p>
          </details>
        </div>


        <div class="thread" id="vision-thread"></div>
      </section>

      <!-- ── REMOVED ────────────────────────────────────────────── -->

      <!-- ── MEMORY ─────────────────────────────────────────────── -->
      <section class="view" data-view="memory">

        <div class="filters" id="memory-filters">
          <button class="filter is-on" data-filter="">全部</button>
          <button class="filter" data-filter="meeting">会议纪要</button>
          <button class="filter" data-filter="exam">拍照解题</button>
        </div>

        <div class="memory" id="memory-list"></div>
        <div class="result" id="memory-detail" hidden></div>
      </section>

    </div>

    <!-- ── Composer：Command Layer，只占底部一条 ─────────────────── -->
    <!-- 附件（题目图片/录音）就挂在这一条上：拖到窗口任意位置都会落进来 -->
    <footer class="composer" id="composer" hidden>
      <div class="drop-veil" id="drop-veil" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 17v1.6A1.4 1.4 0 0 0 5.4 20h13.2a1.4 1.4 0 0 0 1.4-1.4V17"/>
        </svg>
        <span>松开鼠标：图片放进输入框</span>
      </div>
      <div class="composer-inner">
        <div class="attach-wrap">
          <button class="plus" id="plus" aria-label="添加附件" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="attach-menu" id="attach-menu" hidden>
            <button data-attach="image">图片</button>
            <button data-attach="audio">录音</button>
          </div>
        </div>
        <textarea id="input" rows="1" placeholder="输入内容"></textarea>
        <button class="send" id="send" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="composer-foot">
        <div class="attach-strip" id="attach-strip" hidden></div>
        <span class="attached" id="attached"></span>
      </div>
    </footer>
  </main>

  <!-- ── Context Panel：需要时从右侧滑出 ────────────────────────── -->
  <aside class="ctx" id="ctx" aria-hidden="true">
    <div class="ctx-head">
      <span class="panel-title">上下文</span>
      <button class="icon-btn" id="ctx-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="ctx-body" id="ctx-body"></div>
  </aside>
</div>

<div class="toast" id="toast" hidden></div>
<input type="file" id="file-input" hidden multiple>
<dialog id="exam-camera-dialog" aria-labelledby="exam-camera-title">
  <h3 id="exam-camera-title">拍摄题目</h3>
  <video id="exam-camera-video" autoplay muted playsinline></video>
  <p id="exam-camera-status" role="status" aria-live="polite"></p>
  <div class="exam-camera-actions">
    <button type="button" class="btn btn-primary" id="exam-camera-shoot" disabled>拍下题目</button>
    <button type="button" class="btn btn-ghost" id="exam-camera-close">取消</button>
  </div>
</dialog>
<script src="{{ url_for('static', filename='exam-camera.js') }}"></script>
<script src="{{ url_for('static', filename='meeting-recorder.js') }}"></script>

<script src="{{ url_for('static', filename='model-switch.js') }}"></script>
<script src="{{ url_for('static', filename='exam.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='hardware-engine.js') }}"></script>
<script src="{{ url_for('static', filename='smart-ring.js') }}"></script>
<script src="{{ url_for('static', filename='live-translation.js') }}"></script>
<script src="{{ url_for('static', filename='lens-imu.js') }}"></script>
<script src="{{ url_for('static', filename='lens-map.js') }}"></script>
<script src="{{ url_for('static', filename='hardware.js') }}"></script>
</body>
</html>
