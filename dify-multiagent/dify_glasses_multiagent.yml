    - id: normalize
      type: custom
      width: 242
      height: 100
      position:
        x: 300
        y: 300
      positionAbsolute:
        x: 300
        y: 300
      sourcePosition: right
      targetPosition: left
      selected: false
      zIndex: 0
      data:
        type: code
        title: 端侧事件归一化（零 token）
        desc: 对齐设计文档 §3：固定枚举 + 置信度门控；train_pain 不降级
        code_language: python3
        code: "import json\n\n\ndef main(text, device_intent, device_confidence, scene_hint):\n    \"\"\"Deterministic pre-processing. No model call, no network.\"\"\"\n    text = (text or \"\").strip()\n    intent = (device_intent or \"\").strip()\n\n    try:\n        conf = float(device_confidence) if str(device_confidence or \"\").strip() else 0.0\n    except (TypeError, ValueError):\n        conf = 0.0\n\n    hint = (scene_hint or \"\").strip().lower()\n    if hint not in (\"meeting\", \"exam\", \"fitness\", \"resource\", \"general\"):\n        hint = \"\"\n\n    # The device intent enum is authoritative only when the device was confident.\n    INTENT_SCENE = {\n        \"meeting_start\": \"meeting\",\n        \"meeting_append\": \"meeting\",\n        \"meeting_summarize\": \"meeting\",\n        \"meeting_stop\": \"meeting\",\n        \"solve\": \"exam\",\n        \"train_start\": \"fitness\",\n        \"train_done\": \"fitness\",\n        \"train_pain\": \"fitness\",\n        \"switch_scene\"\
          : \"\",\n        \"stop\": \"\",\n        \"cancel\": \"\",\n        \"wake\": \"\",\n    }\n    scene_from_intent = INTENT_SCENE.get(intent, \"\")\n    trusted = bool(scene_from_intent) and conf >= 0.75\n    if intent == \"train_pain\":\n        trusted = True  # safety content is never gated on confidence\n\n    # assitant-lite already routed; its hint wins over a weak device guess.\n    effective = hint or (scene_from_intent if trusted else \"\")\n\n    return {\n        \"query\": text or \"(no text)\",\n        \"scene_hint\": effective or \"unknown\",\n        \"device_scene\": scene_from_intent or \"none\",\n        \"device_trusted\": \"yes\" if trusted else \"no\",\n        \"confidence\": str(conf),\n        \"router_note\": json.dumps(\n            {\n                \"device_intent\": intent,\n                \"confidence\": conf,\n                \"trusted\": trusted,\n                \"hint\": hint,\n            },\n            ensure_ascii=False,\n        ),\n  \
          \  }\n"
        variables:
        - variable: text
          value_selector:
          - start
          - text
        - variable: device_intent
          value_selector:
          - start
          - device_intent
        - variable: device_confidence
          value_selector:
          - start
          - device_confidence
        - variable: scene_hint
          value_selector:
          - start
          - scene_hint
        outputs:
          query:
            type: string
            children: null
          scene_hint:
            type: string
            children: null
          device_scene:
            type: string
            children: null
          device_trusted:
            type: string
            children: null
          confidence:
