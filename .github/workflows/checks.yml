name: Application checks
on:
  push:
    branches: [master, "codex/**"]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: langgraph-app/requirements*.txt
      - run: pip install -r langgraph-app/requirements-dev.txt -r langgraph-app/requirements-production.txt
      - run: python -m pytest tests -q
        working-directory: langgraph-app
      - run: |
          for test in langgraph-app/tests/test_*.cjs; do node "$test"; done
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:full
      - run: npm run build:demo
