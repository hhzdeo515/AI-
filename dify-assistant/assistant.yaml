app:
  name: 眼镜 AI 智能助手
  mode: advanced-chat
  description: 语音文本/图片/按键事件输入；总控路由、拍题、会议、导航接入与资料导出。本机持久存储及独立知识库，硬件与地图待接入。
  icon: 👓
  icon_type: emoji
  icon_background: '#D5F5F6'
  use_icon_as_answer_icon: false
kind: app
version: 0.7.0
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.21@5873fe73395aeb49ba26035059eb4e0ec5af01bb66d0545b031f8917b12e8c29
    version: null
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/volcengine:0.0.19@b18c7067025ff53909fd63a4146a98ee2b0e4b452086b45b774242790fc569ed
    version: null
workflow:
  conversation_variables:
  - id: e59c91e4-4d77-40ae-b05c-76665f972ae6
    name: context_json
    description: 本流程自动维护
    selector:
    - conversation
    - context_json
    value: '{}'
    value_type: string
  - id: 87709e8a-c560-4a09-8990-3369d3172f89
    name: active_scene
    description: 本流程自动维护
    selector:
    - conversation
    - active_scene
    value: general
    value_type: string
  - id: a301e3a5-4b26-47c5-9029-7063f8dddcba
    name: last_resource_id
    description: 本流程自动维护
    selector:
    - conversation
    - last_resource_id
    value: ''
    value_type: string
  environment_variables:
  - id: c437e4ae-a025-42a0-aa30-5ed947d2997c
    name: service_token
    description: 本机资料服务凭据
    selector:
    - env
    - service_token
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: true
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，我是眼镜 AI 智能助手。拍题支持公考六类：言语理解、数量关系、判断推理（重点图形推理）、资料分析、政治理论、常识。请上传完整题干与全部选项；图形题会直接查看原图并复核，模糊或条件不足时请补拍。也支持会议纪要、资料查询与导出。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 上传图形推理题，核对规律并排除选项
    - 现期120亿元，同比增长20%，基期是多少？
    - 开始会议记录
    - 把最新题解导出成 Word
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: start
      type: custom
      position:
        x: 0
        y: 300
      positionAbsolute:
        x: 0
        y: 300
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 用户输入 · 文字 / 图片 / 按键 JSON
        type: start
        desc: ''
        selected: false
        variables: []
    - id: normalize
      type: custom
      position:
        x: 300
        y: 300
      positionAbsolute:
        x: 300
        y: 300
      width: 260
      height: 100
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 校验输入与关联事件
        type: code
        desc: ''
        selected: false
        code: "import json,uuid\ndef main(query,files,owner,conversation_id,context_json):\n\
          \    event={};error='';text=query or ''\n    if text.lstrip().startswith('{'):\n\
          \        try:\n            event=json.loads(text)\n            if not isinstance(event,dict):raise\
          \ ValueError('需要 JSON 对象')\n            text=str(event.get('text',''))\n\
          \        except Exception:error='按键事件 JSON 格式不正确，请检查后重试。';event={}\n   \
          \ payload={'owner':owner,'session_id':conversation_id,'request_id':str(event.get('event_id')\
          \ or uuid.uuid4()),'query':text,'files':files or [],'event':event,'input_error':error,'previous_context':context_json\
          \ or '{}'}\n    return {'payload':json.dumps(payload,ensure_ascii=False),'query':text,'has_image':'yes'\
          \ if files else 'no','event_json':json.dumps(event,ensure_ascii=False)}\n"
        code_language: python3
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: files
          value_selector:
          - sys
          - files
        - variable: owner
          value_selector:
          - sys
          - user_id
        - variable: conversation_id
          value_selector:
          - sys
          - conversation_id
        - variable: context_json
          value_selector:
          - conversation
          - context_json
        outputs:
          payload:
            type: string
            children: null
          query:
            type: string
            children: null
          has_image:
            type: string
            children: null
          event_json:
            type: string
            children: null
