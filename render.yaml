# Review the paid compute and disk charges in Render before creating this service.
# New services receive a private generated login token; existing tokens are retained.
services:
  - type: web
    name: ai-assistant
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: "off"
    numInstances: 1
    disk:
      name: assistant-data
      mountPath: /var/lib/ai-assistant
      sizeGB: 5
    envVars:
      - key: ACCESS_TOKEN
        generateValue: true
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: PUBLIC_SCHEME
        value: https
      - key: DATA_DIR
        value: /var/lib/ai-assistant
      - key: TASK_WORKERS
        value: "1"
